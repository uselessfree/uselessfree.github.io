</style><header><h1>每日总结</h1><button class="shell-control" id="toggle-sidebar" type="button" aria-expanded="true" aria-controls="summary-sidebar">隐藏侧栏</button><button class="shell-control" id="reading-fullscreen" type="button">全屏阅读</button><span id="export-status" role="status" aria-live="polite"></span><button id="export-pdf" type="button" disabled title="导出当前日报；在打印窗口选择存储为PDF">导出PDF</button></header><button id="exit-reading" type="button" hidden>退出全屏 · Esc</button><div class="layout"><aside id="summary-sidebar" aria-label="总结日期"><a class="day active" href="2026-10-22/report.html" target="report-frame" data-date="2026-10-22"><strong>2026-10-22 · 盘后总结</strong><small>美东交易日 2026-10-21</small><span>AI反弹延续，盘后检验兑现能力</span></a><a class="day" href="2026-10-21/report.html" target="report-frame" data-date="2026-10-21"><strong>2026-10-21 · 盘后总结</strong><small>美东交易日 2026-10-20</small><span>科技收盘偏弱，盘后AI链反弹</span></a></aside><iframe name="report-frame" title="每日盘后总结" src="2026-10-22/report.html"></iframe></div><script>for(const a of document.querySelectorAll(".day"))a.addEventListener("click",()=>{for(const x of document.querySelectorAll(".day"))x.classList.toggle("active",x===a);});</script><script>const REPORT_PRINT_CSS="@page{size:A4 portrait;margin:12mm 10mm}\n@media print{\n html,body{background:white!important;color:#253747!important;font-size:10pt!important;line-height:1.6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n main{max-width:none!important;width:auto!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}\n h1{font-size:20pt!important;padding-bottom:10px!important}h2{font-size:14pt!important;margin-top:18px!important;padding-top:12px!important;break-after:avoid}h3{font-size:11pt!important;break-after:avoid}\n .lead{font-size:11pt!important;padding:12px!important;margin:12px 0!important}.analysis{font-size:9pt!important;padding:8px 10px!important}\n .quote-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important;margin:8px 0!important}.macro-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}\n .quote-card{padding:8px 5px!important;break-inside:avoid}.quote-label{font-size:8pt!important}.quote-value,.macro-grid .quote-value{font-size:14pt!important}.quote-change{font-size:9pt!important}\n .megacap-grid{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:5px!important}.megacap-card{padding:7px 3px!important;break-inside:avoid}.megacap-card span{font-size:8pt!important}.megacap-card strong{font-size:10pt!important}\n .sector-inline{flex-wrap:wrap!important;overflow:visible!important;gap:5px 12px!important;font-size:8pt!important;padding:8px!important;break-inside:avoid}\n .mover-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important}.mover-panel{padding:8px!important;break-inside:avoid}.mover-panel h3{font-size:9pt!important}.mover-line{font-size:9pt!important}.mover-row{padding:5px 0!important}.mover-row small{font-size:7pt!important}\n figure{break-inside:avoid;margin:10px 0!important}img{max-width:100%!important}.close-heatmap{width:100%!important;height:auto!important}\n .earnings-card{break-inside:avoid}.earnings-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.earnings-cell{padding:9px 12px!important;font-size:9pt!important}.earnings-cell b{font-size:12pt!important}.earnings-label,.earnings-cell small{font-size:8pt!important}.earnings-cell:nth-child(2){border-right:0}.earnings-cell:nth-child(-n+2){border-bottom:1px solid #e9e0d1}.earnings-note{font-size:9pt!important}\n .table-wrap{overflow:visible!important;border:0!important}.table-wrap table{width:100%!important;min-width:0!important;table-layout:fixed;font-size:8pt!important}thead{display:table-header-group}tr{break-inside:avoid}th,td{padding:5px 4px!important;overflow-wrap:anywhere}\n .table-wrap th:nth-child(1){width:7%}.table-wrap th:nth-child(2){width:21%}.table-wrap th:nth-child(3){width:21%}.table-wrap th:nth-child(4){width:12%}.table-wrap th:nth-child(5){width:13%}.table-wrap th:nth-child(6){width:26%}\n .option-detail,.abnormal-multiple{min-width:0!important}.option-leg{grid-template-columns:1em minmax(32px,1fr) auto!important;gap:2px!important;font-size:7pt!important}.option-leg small{font-size:6pt!important}.option-quantity{font-size:7pt!important;white-space:normal!important}.option-amount{white-space:normal!important}.abnormal-multiple{white-space:normal!important}\n .pl-chart{width:100%!important;min-width:0!important}.pl-svg{width:100%!important}.ref,.meta,small{font-size:8pt!important}details{font-size:8pt!important;overflow:visible!important}summary{font-size:9pt!important}\n a{color:inherit!important;text-decoration:none!important}.read li{break-inside:avoid}button{display:none!important}\n}\n";const reportFrame=document.querySelector('iframe[name="report-frame"]');
const exportButton=document.querySelector('#export-pdf');
const exportStatus=document.querySelector('#export-status');
function reportReady(){
 try{return reportFrame.contentDocument?.querySelector('main h1')!=null;}catch{return false;}
}
function updateExport(){exportButton.disabled=!reportReady();exportStatus.textContent='';}
reportFrame.addEventListener('load',updateExport);
for(const link of document.querySelectorAll('.day'))link.addEventListener('click',()=>{exportButton.disabled=true;exportStatus.textContent='';});
updateExport();
exportButton.addEventListener('click',async()=>{
 if(!reportReady())return;
 exportButton.disabled=true;
 try{
  const doc=reportFrame.contentDocument,win=reportFrame.contentWindow;
  if(!doc.querySelector('#daily-print-style')){
   const style=doc.createElement('style');style.id='daily-print-style';style.textContent=REPORT_PRINT_CSS;doc.head.append(style);
  }
  await Promise.all(Array.from(doc.images).map(img=>img.decode().catch(()=>{})));
  await doc.fonts.ready;
  const priorTitle=doc.title,details=Array.from(doc.querySelectorAll('details')).map(el=>[el,el.open]);
  const restore=()=>{doc.title=priorTitle;for(const[el,open]of details)el.open=open;win.removeEventListener('afterprint',restore);};
  win.addEventListener('afterprint',restore,{once:true});
  doc.title=doc.querySelector('main h1').textContent.trim();
  for(const[el]of details)el.open=true;
  exportStatus.textContent='在打印窗口选择“存储为PDF”';
  try{win.focus();win.print();}catch(error){restore();throw error;}
 }catch(error){exportStatus.textContent='未能打开打印窗口，请在浏览器中打开日报后重试。';}
 finally{exportButton.disabled=!reportReady();}
});

const REPORT_READING_CSS="@media screen{\n body{font-size:18px;line-height:1.85}\n main{max-width:1680px;width:calc(100% - 40px);padding:32px 38px;margin:20px auto}\n main>h1{font-size:34px}.lead{font-size:21px}.analysis{font-size:17px}\n h2{font-size:26px}main>h3{font-size:21px}\n .quote-label{font-size:17px}.quote-value{font-size:34px}.quote-change{font-size:18px}\n .macro-grid .quote-value{font-size:28px}.megacap-title{font-size:18px}.megacap-card span{font-size:16px}.megacap-card strong{font-size:23px}\n .sector-inline{font-size:15px;gap:16px}.mover-panel h3{font-size:18px}.mover-line{font-size:18px}.mover-row small{font-size:14px}\n .earnings-name strong{font-size:17px}.earnings-name{font-size:14px}.earnings-cell{font-size:17px}.earnings-label,.earnings-cell small{font-size:14px}.earnings-cell b{font-size:23px}.earnings-note{font-size:16px}\n .table-wrap table{font-size:16px}.table-wrap th{font-size:15px}.option-leg small{font-size:13px}.option-quantity{font-size:14px}\n .meta,.ref,small{font-size:14px}.read li{font-size:17px}summary{font-size:16px}\n body.reading-full main{margin-top:50px}\n @media(max-width:1100px){.macro-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quote-value{font-size:29px}.macro-grid .quote-value{font-size:26px}}\n @media(max-width:800px){main{width:100%;padding:24px 20px;margin:0;border-radius:0}main>h1{font-size:28px}.lead{font-size:19px}.quote-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.macro-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quote-label{font-size:16px}.quote-value{font-size:29px}.macro-grid .quote-value{font-size:23px}.earnings-cell b{font-size:21px}.earnings-cell{font-size:16px}.mover-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n @media(max-width:450px){.macro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.megacap-card strong{font-size:21px}.earnings-cell b{font-size:19px}}\n}\n";const sidebarButton=document.querySelector('#toggle-sidebar');
const fullButton=document.querySelector('#reading-fullscreen');
const exitButton=document.querySelector('#exit-reading');
const readingFrame=document.querySelector('iframe[name="report-frame"]');
let sidebarHidden=false,readingFull=false;
try{sidebarHidden=localStorage.getItem('sixear-daily-sidebar-hidden')==='1';}catch{}
function applyReading(){
 document.body.classList.toggle('sidebar-hidden',sidebarHidden);
 document.body.classList.toggle('reading-mode',readingFull);
 sidebarButton.textContent=sidebarHidden?'显示侧栏':'隐藏侧栏';
 sidebarButton.setAttribute('aria-expanded',String(!sidebarHidden));
 exitButton.hidden=!readingFull;
 try{readingFrame.contentDocument.body.classList.toggle('reading-full',readingFull);}catch{}
}
function setReadingFull(value){readingFull=value;applyReading();if(!value)fullButton.focus();}
sidebarButton.addEventListener('click',()=>{sidebarHidden=!sidebarHidden;try{localStorage.setItem('sixear-daily-sidebar-hidden',sidebarHidden?'1':'0');}catch{}applyReading();});
fullButton.addEventListener('click',()=>setReadingFull(true));
exitButton.addEventListener('click',()=>setReadingFull(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&readingFull)setReadingFull(false);});
function installReadingStyle(){
 try{
  const doc=readingFrame.contentDocument;
  if(!doc.querySelector('main h1'))return;
  if(!doc.querySelector('#daily-reading-style')){
   const style=doc.createElement('style');style.id='daily-reading-style';style.textContent=REPORT_READING_CSS;doc.head.append(style);
   doc.addEventListener('keydown',e=>{if(e.key==='Escape'&&readingFull)setReadingFull(false);});
  }
  applyReading();
 }catch{}
}
readingFrame.addEventListener('load',installReadingStyle);
applyReading();installReadingStyle();
</script></html>
